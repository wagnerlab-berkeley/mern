[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mern"
version = "0.1.0"
description = "Graph-guided metabolic representation learning for single-cell transcriptomic data."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "MERN developers"},
]
keywords = ["single-cell", "metabolism", "scvi-tools", "anndata", "torch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "scvi-tools==1.3.1.post1",
    "anndata>=0.11",
    "lightning>=2.0",
    "networkx>=3.0",
    "numpy",
    "pandas",
    "scikit-learn>=1.0.0",
    "scipy",
    "statsmodels>=0.13.0",
    "torch",
    "torch-geometric",
    "tqdm",
]

[project.optional-dependencies]
plot = [
    "matplotlib",
    "plotly",
    "scanpy>=1.10",
    "seaborn",
]
kegg = [
    "biopython>=1.79",
    "mygene",
]
dev = [
    "black>=24.0",
    "build>=1.2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]
all = [
    "mern[plot,kegg,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mern"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/src/mern",
    "/tests",
    "/docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.black]
line-length = 99
target-version = ["py310"]
