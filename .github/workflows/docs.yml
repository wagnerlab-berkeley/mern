name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**"]        # only rebuild when the docs change
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Notebooks are rendered from their saved outputs (nb_execution_mode = "off"), so only the
      # Sphinx toolchain is needed, not the mern package. Versions match the local mern_clean env.
      - run: pip install "sphinx==8.1.3" "myst-nb==1.4.0" "sphinx-book-theme==1.1.4"
      - run: make -C docs html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
